server:
  port: 8080

spring:
  datasource:
    # 开发期用 H2 文件数据库，零安装；部署时可换成 MySQL
    url: jdbc:h2:file:./data/campusbook
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # 正式部署请换成足够长且随机的字符串
  secret: "campus-book-exchange-secret-key-2026-change-me-please-1234567890"
  expiration: 86400000
